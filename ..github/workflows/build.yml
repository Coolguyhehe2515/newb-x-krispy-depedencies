name: Discord Notification

on:
  push:
  workflow_dispatch:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"GitHub\",
              \"content\": \"**New push!**\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nAuthor: ${{ github.actor }}\nCommit: ${{ github.event.head_commit.message }}\"
            }" \
            "$DISCORD_WEBHOOK"
